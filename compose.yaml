services:
    tb3:
      build:
        context: .
        args:
          GO_VERSION: ${GO_VERSION}
      environment:
          GEMINI_API_KEY: ${GEMINI_API_KEY}
          SEARCH_API_KEY: ${SEARCH_API_KEY}
          SEARCH_ID: ${SEARCH_ID}
      volumes:
      - torabot:/data

volumes:
    torabot: